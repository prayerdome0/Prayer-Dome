name: Android build

# Real Prayer Dome Android CI: produces an installable debug APK and release
# APK/AAB entirely on GitHub's servers — no developer machine is required.
#
# One-time activation (the GitHub App used to push this repository cannot
# create workflow files itself). From a maintainer account with normal
# permissions run:
#
#   node scripts/install-workflows.mjs
#
# which copies this file and ci/verify.yml into .github/workflows/ and commits
# them. After that every push to main builds the app automatically, and the
# artifacts (APK/AAB) are attached to the workflow run for download.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'scripts/prepare-mobile.mjs'
      - '*.html'
      - '*.js'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare and sync Capacitor
        run: npm run mobile:sync

      - name: Add google-services.json when the secret is configured
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json added — native push notifications are enabled."
          else
            echo "No GOOGLE_SERVICES_JSON secret; the app uses web push delivery."
          fi

      - name: Configure release signing when secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Release signing configured."
          else
            echo "No Android signing secrets configured; the release outputs will be unsigned."
          fi

      - name: Build debug APK and release outputs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prayer-dome-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
