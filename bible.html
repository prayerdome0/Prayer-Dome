    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --accent-green: #0A4D9B;
            --accent-green-light: #3b82f6;
            --accent-gold: #d4af37;
            --accent-gold-dark: #b45309;
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-lg: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding-bottom: 140px; overflow-x: hidden; }
        body.dark-mode { --bg-primary: #0f172a; --bg-card: #1e293b; --text-primary: #f8fafc; --text-secondary: #cbd5e1; --border-color: #334155; }
        .version-note { font-size: .72rem; font-weight: 600; color: var(--text-secondary); letter-spacing: .03em; padding: 6px 10px; border-radius: 30px; background: rgba(10,77,155,.08); border: 1px solid rgba(10,77,155,.18); }
        body.dark-mode .version-note { background: rgba(212,175,55,.12); border-color: rgba(212,175,55,.28); color: #f6df8a; }

        /* Luxury Font */
        .luxury-font, h1, h2, .chapter-title { font-family: 'Poppins', serif; }

        /* Header with Logo */
        .bible-header { 
            background: var(--bg-card); 
            padding: 12px 25px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        body.dark-mode .bible-header { background: rgba(15,23,42,0.95); }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        .logo-ring { 
            width: 48px; 
            height: 48px; 
            background: linear-gradient(135deg, var(--accent-green), var(--accent-gold)); 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 4px 15px rgba(10,77,155,0.3);
        }
        .logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            background: white;
            padding: 5px;
        }
        .brand-text h1 { 
            font-size: 1.3rem; 
            font-weight: 900; 
            letter-spacing: 1px;
            font-family: 'Poppins', serif;
        }
        .brand-text p { 
            font-size: 0.6rem; 
            opacity: 0.7; 
            letter-spacing: 1px;
        }

        .theme-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 14px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-primary);
        }
        .theme-btn:hover { transform: scale(1.05); background: rgba(59,130,246,0.1); }

        /* Progress Bar */
        .progress-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .progress-bar-bg {
            background: var(--bg-primary);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-stats {
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--text-sub);
            text-align: right;
        }

        .app-wrapper { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .app-tabs { display: flex; gap: 10px; background: var(--bg-card); padding: 8px; border-radius: 60px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .app-tab { flex: 1; padding: 12px; border: none; background: transparent; font-weight: 700; cursor: pointer; border-radius: 50px; color: var(--text-secondary); transition: 0.2s; text-align: center; font-size: 0.9rem; }
        .app-tab.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-green-light)); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .controls-panel { background: var(--bg-card); border-radius: 24px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .version-selector { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; overflow: visible; padding-bottom: 12px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); min-width: 0; }
        .version-btn { padding: 8px clamp(12px, 2vw, 18px); border-radius: 30px; border: 2px solid var(--border-color); background: var(--bg-primary); color: var(--text-secondary); font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .version-btn.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-green-light)); border-color: var(--accent-green); color: white; }
        .version-btn:hover { transform: translateY(-2px); }

        .nav-controls { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-controls select { flex: 1; min-width: 130px; padding: 12px 15px; border-radius: 12px; border: 2px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-weight: 600; outline: none; cursor: pointer; }
        .btn-read { background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark)); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-read:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.4); }

        .bible-reader { background: var(--bg-card); border-radius: 24px; padding: 32px clamp(18px, 4vw, 48px) 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: clamp(1rem, 2.4vw, 1.24rem); line-height: 1.85; color: var(--text-primary); width: min(100%, 820px); min-width: 0; margin: 14px auto; overflow-wrap: anywhere; word-wrap: break-word; overflow-x: hidden; -webkit-hyphens: auto; hyphens: auto; }
        body.bible-text-large .bible-reader { font-size: clamp(1.2rem, 3vw, 1.45rem); line-height: 1.9; }
        body.bible-text-small .bible-reader { font-size: clamp(.95rem, 2.3vw, 1.05rem); line-height: 1.75; }
        .chapter-title-wrap { text-align: center; margin-bottom: 22px; }
        .chapter-title { font-family: 'Poppins', serif; text-align: center; font-size: clamp(1.4rem, 3.6vw, 1.9rem); color: var(--accent-green); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
        .chapter-translation { text-align: center; font-size: .72rem; font-weight: 700; font-family: 'Inter', sans-serif; color: var(--accent-gold); letter-spacing: .18em; text-transform: uppercase; margin-top: 6px; }
        .chapter-divider { width: 56px; height: 3px; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); margin: 14px auto 24px; border-radius: 3px; }
        .verses-container { text-align: justify; }
        .verse-item { display: inline; padding: 1px 2px; border-radius: 4px; cursor: pointer; transition: background .15s; position: relative; margin-right: 0.25em; }
        .verse-item:hover { background: rgba(59,130,246,0.1); }
        .verse-item.selected { background: rgba(212,175,55,0.22); border-radius: 6px; box-shadow: 0 0 0 1px rgba(212,175,55,.3); }
        .verse-item.reading { background: rgba(59,130,246,0.18); color: var(--accent-green); font-weight: 600; }
        .verse-num { font-size: .68em; font-weight: 800; color: var(--accent-gold); vertical-align: super; margin-right: .28em; margin-left: .18em; font-family: 'Inter', sans-serif; line-height: 0; opacity: 0.92; -webkit-font-smoothing: antialiased; }
        .verse-item:first-child .verse-num { margin-left: 0; }
        .bible-error { text-align: center; padding: 32px 20px; color: var(--text-secondary); font-family: 'Inter', sans-serif; }
        .bible-error h4 { color: var(--accent-green); margin: 0 0 8px; }
        .bible-error p { font-size: .9rem; line-height: 1.6; max-width: 520px; margin: 0 auto 14px; }
        .bible-copyright { text-align: center; font-family: 'Inter', sans-serif; font-size: .7rem; color: var(--text-secondary); margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border-color); line-height: 1.5; }
        .text-size-controls { display: inline-flex; gap: 4px; margin-left: 10px; align-items: center; }
        .text-size-controls button { border: 1px solid var(--border-color); background: transparent; color: var(--text-secondary); width: 30px; height: 30px; border-radius: 50%; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: .78rem; }
        .text-size-controls button.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

        /* Reading Plan - Books Grid */
        .reading-plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .book-progress-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .book-progress-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); }
        .book-name { font-weight: 800; font-size: 0.85rem; }
        .book-chapters { font-size: 0.7rem; color: var(--text-sub); margin: 5px 0; }
        .book-progress-bar { height: 4px; background: var(--bg-primary); border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .book-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-green), var(--accent-gold)); width: 0%; border-radius: 5px; }
        .book-complete-badge { color: var(--accent-green); font-size: 0.7rem; }

        /* Notebook */
        .notebook-item { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border-color); border-left: 5px solid var(--accent-gold); transition: 0.2s; }
        .notebook-item:hover { transform: translateX(5px); }
        .notebook-ref { color: var(--accent-green); font-weight: 800; margin-bottom: 8px; }
        .notebook-text { font-size: 0.95rem; line-height: 1.6; }
        .notebook-date { font-size: 0.7rem; color: var(--text-secondary); margin-top: 8px; }

        /* Search Results */
        .search-result-item { background: var(--bg-card); border-radius: 20px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .search-result-item:hover { transform: translateX(5px); border-left: 4px solid var(--accent-gold); }
        .search-result-ref { color: var(--accent-green); font-weight: 800; font-size: 0.9rem; margin-bottom: 8px; }
        .search-result-text { font-size: 0.95rem; line-height: 1.6; color: var(--text-secondary); }

        .action-bar { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; display: none; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; align-items: center; }
        .action-bar button { background: none; border: none; color: white; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .action-bar button:hover { transform: scale(1.1); color: var(--accent-gold); }

        .audio-player { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 12px 20px; display: none; justify-content: space-between; align-items: center; z-index: 999; flex-wrap: wrap; gap: 10px; }

        .loading-spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); }
        .modal-content { background: var(--bg-card); border-radius: 28px; padding: 30px; width: 90%; max-width: 500px; animation: modalPop 0.3s ease; }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content textarea { width: 100%; height: 120px; padding: 12px; border-radius: 16px; border: 2px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); margin: 15px 0; font-family: inherit; }

        @media (max-width: 600px) {
            .bible-reader { padding: 22px clamp(14px, 4vw, 20px) 28px; border-radius: 18px; margin: 10px auto; font-size: clamp(.98rem, 4vw, 1.08rem); line-height: 1.78; max-width: 100%; }
            .chapter-title { font-size: clamp(1.3rem, 6vw, 1.6rem); }
            .version-note { display: inline-flex; max-width: 100%; font-size: .68rem; }
            .version-selector { flex-wrap: wrap; gap: 6px; }
            .version-btn { padding: 7px 12px; font-size: .84rem; }
            .text-size-controls { margin-left: auto; }
            .action-bar { padding: 8px 16px; gap: 12px; bottom: 100px; }
            .reading-plan-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .logo-ring { width: 40px; height: 40px; }
            .brand-text h1 { font-size: 1rem; }
        }
    </style>

            <div class="brand-text">
                <h1>PRAYER DOME</h1>
                <p>HOLY BIBLE</p>

    <div class="app-wrapper">

                </div>

                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>

                <span id="savedOfflineBadge" style="display:none; align-items:center; gap:6px; font-size:.72rem; font-weight:700; color:#0A4D9B; background:rgba(10,77,155,.1); border:1px solid rgba(10,77,155,.25); border-radius:50px; padding:6px 14px; margin-top:10px;"></span>

            <div class="bible-reader" id="bibleReader">
                <div style="text-align:center; padding:50px 0; opacity:0.6;">
                    <i class="pd-i pd-i-book-open-text pd-i-4x" style="color: var(--accent-gold);"></i>

        <!-- PROGRESS TAB -->

    <!-- Floating Action Bar -->
    <div class="action-bar" id="actionBar">
        <button onclick="copyVerse()" title="Copy Verse"><i class="pd-i pd-i-copy"></i></button>

    <!-- Audio Player -->
    <div class="audio-player" id="audioPlayer">
        <div style="display:flex; align-items:center; gap:12px;">
            <i class="pd-i pd-i-headphones" style="color:var(--accent-green); font-size: 1.3rem;"></i>

    <div class="modal" id="noteModal">

            <p id="noteRef" style="color: var(--accent-gold); margin: 10px 0;"></p>
            <textarea id="noteText" placeholder="Write your thoughts, insights, or prayer points..."></textarea>
            <div style="display: flex; gap: 12px;">
                <button class="btn-read" style="flex:1;" onclick="saveNote()">Save Note</button>
                <button class="btn-read" style="flex:1; background: var(--accent-red);" onclick="closeModal('noteModal')">Cancel</button>

    <script type="module">
        // Firebase is loaded on demand. The reader must not depend on it: if the
        // CDN is blocked or offline, guests keep reading and saving locally.
        const FIREBASE_BASE = "https://www.gstatic.com/firebasejs/10.8.0/";
        const firebaseConfig = { 
            apiKey: "AIzaSyCxvql0r_aeerphxTA0UUedRppdBxGf7wo", 
            authDomain: "prayer-dome.firebaseapp.com", 
            projectId: "prayer-dome", 
            storageBucket: "prayer-dome.firebasestorage.app", 
            messagingSenderId: "198295153196", 
            appId: "1:198295153196:web:1222b31948d7974ba3bf89" 
        };
        let fbDb = null;
        let fbAuth = null;
        let fbApi = null;
        async function loadFirebase() {
            try {
                const [appMod, fsMod, authMod] = await Promise.all([
                    import(FIREBASE_BASE + "firebase-app.js"),
                    import(FIREBASE_BASE + "firebase-firestore.js"),
                    import(FIREBASE_BASE + "firebase-auth.js")
                ]);
                const app = appMod.initializeApp(firebaseConfig);
                fbDb = fsMod.getFirestore(app);
                fbAuth = authMod.getAuth(app);
                fbApi = {
                    doc: fsMod.doc, getDoc: fsMod.getDoc, setDoc: fsMod.setDoc, updateDoc: fsMod.updateDoc,
                    collection: fsMod.collection, addDoc: fsMod.addDoc, getDocs: fsMod.getDocs,
                    query: fsMod.query, orderBy: fsMod.orderBy, serverTimestamp: fsMod.serverTimestamp,
                    onAuthStateChanged: authMod.onAuthStateChanged
                };
                return true;
            } catch (error) {
                console.warn("Account sync is unavailable; the Bible still works on this device.", error && error.message);
                fbDb = null; fbAuth = null; fbApi = null;
                return false;
            }
        }

        const BIBLE_VERSIONS = {
            NIV: { name: 'New International Version', copyright: 'The Holy Bible, New International Version®, NIV® Copyright © 1973, 1978, 1984, 2011 by Biblica, Inc.® Used by permission. All rights reserved worldwide.' },
            KJV: { name: 'King James Version', copyright: 'King James Version (KJV). Public domain in the United States.' },
            NLT: { name: 'New Living Translation', copyright: 'Holy Bible, New Living Translation®, copyright © 1996, 2004, 2015 by Tyndale House Foundation. Used by permission of Tyndale House Publishers, Inc. All rights reserved.' },
            ESV: { name: 'English Standard Version', copyright: 'The Holy Bible, English Standard Version® (ESV®), copyright © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.' },
            MSG: { name: 'The Message', copyright: 'The Message® copyright © 1993, 2002, 2018 by Eugene H. Peterson. Used by permission of NavPress. All rights reserved.' }
        };
        const TEXT_SIZES = ['small', 'medium', 'large'];
        function readPreference(key, fallback) {
            try { return localStorage.getItem(key) || fallback; }
            catch (e) { return fallback; }
        }
        const storedVersion = readPreference('pd_bible_version', 'NIV').toUpperCase();
        let currentVersion = BIBLE_VERSIONS[storedVersion] ? storedVersion : 'NIV';
        let currentTranslationName = BIBLE_VERSIONS[currentVersion].name;
        let currentUser = null;
        let currentCopyright = BIBLE_VERSIONS[currentVersion].copyright;
        let currentVerses = [];
        let selectedVerseIdx = null;
        let currentBookName = "";
        let currentChapter = "";
        let chapterRequestId = 0;
        let readChapters = new Set(); // Track read chapters as "BookName ChapterNumber"
        let notes = [];
        let textSize = readPreference('pd_bible_textsize', 'medium');
        if (!TEXT_SIZES.includes(textSize)) textSize = 'medium';
        document.body.classList.add('bible-text-' + textSize);

        // Bible Books with chapter counts
        const bibleBooks = [
            {name:"Genesis", ch:50, id:1}, {name:"Exodus", ch:40, id:2}, {name:"Leviticus", ch:27, id:3}, {name:"Numbers", ch:36, id:4}, {name:"Deuteronomy", ch:34, id:5},
            {name:"Joshua", ch:24, id:6}, {name:"Judges", ch:21, id:7}, {name:"Ruth", ch:4, id:8}, {name:"1 Samuel", ch:31, id:9}, {name:"2 Samuel", ch:24, id:10},
            {name:"1 Kings", ch:22, id:11}, {name:"2 Kings", ch:25, id:12}, {name:"1 Chronicles", ch:29, id:13}, {name:"2 Chronicles", ch:36, id:14}, {name:"Ezra", ch:10, id:15},
            {name:"Nehemiah", ch:13, id:16}, {name:"Esther", ch:10, id:17}, {name:"Job", ch:42, id:18}, {name:"Psalms", ch:150, id:19}, {name:"Proverbs", ch:31, id:20},
            {name:"Ecclesiastes", ch:12, id:21}, {name:"Song of Solomon", ch:8, id:22}, {name:"Isaiah", ch:66, id:23}, {name:"Jeremiah", ch:52, id:24}, {name:"Lamentations", ch:5, id:25},
            {name:"Ezekiel", ch:48, id:26}, {name:"Daniel", ch:12, id:27}, {name:"Hosea", ch:14, id:28}, {name:"Joel", ch:3, id:29}, {name:"Amos", ch:9, id:30},
            {name:"Obadiah", ch:1, id:31}, {name:"Jonah", ch:4, id:32}, {name:"Micah", ch:7, id:33}, {name:"Nahum", ch:3, id:34}, {name:"Habakkuk", ch:3, id:35},
            {name:"Zephaniah", ch:3, id:36}, {name:"Haggai", ch:2, id:37}, {name:"Zechariah", ch:14, id:38}, {name:"Malachi", ch:4, id:39},
            {name:"Matthew", ch:28, id:40}, {name:"Mark", ch:16, id:41}, {name:"Luke", ch:24, id:42}, {name:"John", ch:21, id:43}, {name:"Acts", ch:28, id:44},
            {name:"Romans", ch:16, id:45}, {name:"1 Corinthians", ch:16, id:46}, {name:"2 Corinthians", ch:13, id:47}, {name:"Galatians", ch:6, id:48}, {name:"Ephesians", ch:6, id:49},
            {name:"Philippians", ch:4, id:50}, {name:"Colossians", ch:4, id:51}, {name:"1 Thessalonians", ch:5, id:52}, {name:"2 Thessalonians", ch:3, id:53}, {name:"1 Timothy", ch:6, id:54},
            {name:"2 Timothy", ch:4, id:55}, {name:"Titus", ch:3, id:56}, {name:"Philemon", ch:1, id:57}, {name:"Hebrews", ch:13, id:58}, {name:"James", ch:5, id:59},
            {name:"1 Peter", ch:5, id:60}, {name:"2 Peter", ch:3, id:61}, {name:"1 John", ch:5, id:62}, {name:"2 John", ch:1, id:63}, {name:"3 John", ch:1, id:64},
            {name:"Jude", ch:1, id:65}, {name:"Revelation", ch:22, id:66}
        ];

        const TOTAL_CHAPTERS = bibleBooks.reduce((sum, b) => sum + b.ch, 0);

        // Load user's reading progress from Firestore
        async function loadReadingProgress() {
            try { updateSavedBadge(); } catch (e) {}
            if (!currentUser) {
                // Try localStorage for guest
                const saved = localStorage.getItem('bible_read_chapters');
                if (saved) {
                    readChapters = new Set(JSON.parse(saved));
                }
                updateProgressUI();
                renderReadingPlan();
                return;
            }
            
            try {
                const progressRef = fbApi.doc(fbDb, "bibleProgress", currentUser.uid);
                const progressDoc = await fbApi.getDoc(progressRef);
                if (progressDoc.exists()) {
                    const data = progressDoc.data();
                    readChapters = new Set(data.readChapters || []);
                } else {
                    await fbApi.setDoc(progressRef, { readChapters: [], lastUpdated: fbApi.serverTimestamp() });
                }
                updateProgressUI();
                renderReadingPlan();
            } catch (error) {
                console.error("Error loading progress:", error);
            }
        }

        // Save reading progress when a chapter is read
        async function saveChapterProgress(book, chapter) {
            const chapterKey = `${book} ${chapter}`;
            if (readChapters.has(chapterKey)) return;
            
            readChapters.add(chapterKey);
            
            if (!currentUser) {
                localStorage.setItem('bible_read_chapters', JSON.stringify([...readChapters]));
                updateProgressUI();
                renderReadingPlan();
                return;
            }
            
            try {
                const progressRef = fbApi.doc(fbDb, "bibleProgress", currentUser.uid);
                await fbApi.updateDoc(progressRef, {
                    readChapters: [...readChapters],
                    lastUpdated: fbApi.serverTimestamp()
                });
                updateProgressUI();
                renderReadingPlan();
                // Show small celebration
                if (typeof confetti === 'function') confetti({ particleCount: 30, spread: 40, origin: { y: 0.8 } });
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--accent-green); color:white; padding:8px 20px; border-radius:30px; z-index:2000; font-weight:600;';
                toast.innerHTML = '<i class="pd-i pd-i-book-open" aria-hidden="true"></i> Chapter marked as read!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            } catch (error) {
                console.error("Error saving progress:", error);
            }
        }

        function updateProgressUI() {
            const chaptersRead = readChapters.size;
            const percent = Math.round((chaptersRead / TOTAL_CHAPTERS) * 100);
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('chaptersRead').innerText = chaptersRead;
            document.getElementById('totalChapters').innerText = TOTAL_CHAPTERS;
        }

        function renderReadingPlan() {
            const container = document.getElementById('readingPlanGrid');
            if (!container) return;
            
            container.innerHTML = bibleBooks.map(book => {
                const chaptersReadCount = [...readChapters].filter(key => key.startsWith(book.name + ' ')).length;
                const percent = Math.round((chaptersReadCount / book.ch) * 100);
                const isComplete = chaptersReadCount === book.ch;
                
                return `
                    <div class="book-progress-card" onclick="goToBook('${book.name}')">
                        <div class="book-name">${book.name}</div>
                        <div class="book-chapters">${chaptersReadCount}/${book.ch} chapters</div>
                        <div class="book-progress-bar">
                            <div class="book-progress-fill" style="width: ${percent}%"></div>
                        </div>
                        ${isComplete ? '<div class="book-complete-badge"><i class="pd-i pd-i-circle-check"></i> Complete</div>' : ''}
                    </div>
                `;
            }).join('');
        }

        function goToBook(bookName) {
            const bookIndex = bibleBooks.findIndex(b => b.name === bookName);
            if (bookIndex !== -1) {
                document.getElementById('bookSelect').value = bookIndex;
                updateChapters();
                document.getElementById('chapterSelect').value = 1;
                fetchChapter();
                switchTab('read');
            }
        };

        // Initialize selects
        function init() {
            const bSel = document.getElementById('bookSelect');
            bibleBooks.forEach((b, i) => bSel.innerHTML += `<option value="${i}">${b.name}</option>`);
            updateChapters();
        }

        function updateChapters() {
            const bIdx = parseInt(document.getElementById('bookSelect').value);
            const cSel = document.getElementById('chapterSelect');
            cSel.innerHTML = "";
            for(let i=1; i<=bibleBooks[bIdx].ch; i++) cSel.innerHTML += `<option value="${i}">Chapter ${i}</option>`;
        };

        function updateVersionButtons() {
            document.querySelectorAll('.version-btn[data-version]').forEach(button => {
                const selected = button.dataset.version === currentVersion;
                button.classList.toggle('active', selected);
                button.setAttribute('aria-pressed', String(selected));
                if (selected) button.setAttribute('aria-current', 'true');
                else button.removeAttribute('aria-current');
            });
        }

        async function checkVersionStatus(version) {
            const status = document.getElementById('versionStatus');
            if (status && version === currentVersion) {
                status.textContent = `${BIBLE_VERSIONS[version].name} · checking sources`;
            }
            try {
                const res = await fetch(`/api/bible?action=status&version=${encodeURIComponent(version)}`);
                const json = await res.json();
                if (!res.ok || !json.ok || json.translation !== version) throw new Error('Version status unavailable');
                if (version === currentVersion) {
                    currentTranslationName = json.translationName || BIBLE_VERSIONS[version].name;
                    currentCopyright = json.copyright || BIBLE_VERSIONS[version].copyright;
                    if (status) {
                        status.textContent = json.configured
                            ? `${currentTranslationName} · ready`
                            : (version === 'NIV'
                                ? `${currentTranslationName} · licensing limit`
                                : `${currentTranslationName} · setup required`);
                        status.title = json.message || (json.getBibleFallbackAvailable
                            ? 'Exact-version sources include Bolls.life and the free GetBible.net KJV fallback.'
                            : `Exact-version sources: ${(json.providers || []).join(', ') || 'version-matched providers'}. GetBible.net does not currently publish this edition; no other translation will be substituted.`);
                    }
                }
                return json;
            } catch (error) {
                if (version === currentVersion && status) {
                    status.textContent = `${BIBLE_VERSIONS[version].name} · source status unavailable`;
                    status.title = 'The selected translation remains unchanged; try loading a chapter to check availability.';
                }
                return { ok: false, translation: version };
            }
        }

        function setVersion(value) {
            const version = String(value || '').trim().toUpperCase();
            if (!BIBLE_VERSIONS[version]) return;
            currentVersion = version;
            currentTranslationName = BIBLE_VERSIONS[version].name;
            currentCopyright = BIBLE_VERSIONS[version].copyright;
            selectedVerseIdx = null;
            const actionBar = document.getElementById('actionBar');
            if (actionBar) actionBar.style.display = 'none';
            try { localStorage.setItem('pd_bible_version', version); } catch (e) { /* preference is optional */ }
            updateVersionButtons();
            checkVersionStatus(version);
            if (currentBookName && currentChapter) fetchChapter();
        };
        updateVersionButtons();

        function setTextSize(size) {
            if (!TEXT_SIZES.includes(size)) return;
            textSize = size;
            try { localStorage.setItem('pd_bible_textsize', size); } catch (e) { /* preference is optional */ }
            document.body.classList.remove('bible-text-small','bible-text-medium','bible-text-large');
            document.body.classList.add('bible-text-' + size);
            document.querySelectorAll('.text-size-controls button').forEach(btn => {
                const active = btn.id === ({ small: 'textSmall', medium: 'textMedium', large: 'textLarge' })[size];
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', String(active));
            });
        };
        setTextSize(textSize);
        checkVersionStatus(currentVersion);

        /* ---------- Offline chapter cache ----------
           Every chapter you read is saved on this device. When the internet
           drops (or data is finished), saved chapters still open instantly —
           the Bible remains usable offline. */
        const BIBLE_CACHE_KEY = 'pd_bible_cache_v2';
        // v1 chapters were saved before the NIV identifier and Strong's cleaning
        // were fixed, so they may hold the wrong text under a label. Drop them.
        try { localStorage.removeItem('pd_bible_cache_v1'); } catch (e) { /* storage optional */ }
        const BIBLE_CACHE_MAX = 120; // chapters kept on the device

        function cacheAll() {
            try { return JSON.parse(localStorage.getItem(BIBLE_CACHE_KEY) || '{}'); }
            catch (e) { return {}; }
        }
        function cacheKey(v, b, c) { return `${v}|${b}|${c}`; }
        function cacheGet(v, b, c) { return cacheAll()[cacheKey(v, b, c)] || null; }
        function cachePut(v, b, c, payload) {
            try {
                const all = cacheAll();
                all[cacheKey(v, b, c)] = Object.assign({ at: Date.now() },
                    payload && payload.verses ? payload : { verses: payload });
                // Keep the most recently used chapters only.
                const entries = Object.entries(all)
                    .sort((a, b) => (b[1].at || 0) - (a[1].at || 0))
                    .slice(0, BIBLE_CACHE_MAX);
                localStorage.setItem(BIBLE_CACHE_KEY, JSON.stringify(Object.fromEntries(entries)));
                updateSavedBadge();
            } catch (e) { /* storage full — cache is best-effort */ }
        }
        function isCached(v, b, c) { return !!cacheGet(v, b, c); }

        function updateSavedBadge() {
            const badge = document.getElementById('savedOfflineBadge');
            if (!badge) return;
            const saved = Object.keys(cacheAll()).length;
            badge.style.display = saved ? 'inline-flex' : 'none';
            badge.innerHTML = `<i class="pd-i pd-i-download" aria-hidden="true"></i> ${saved} chapter${saved === 1 ? '' : 's'} saved offline`;
        }

        async function fetchChapter() {
            const requestId = ++chapterRequestId;
            const version = currentVersion;
            const bookIndex = parseInt(document.getElementById('bookSelect').value, 10);
            const book = bibleBooks[bookIndex];
            const chapter = parseInt(document.getElementById('chapterSelect').value, 10);
            const reader = document.getElementById('bibleReader');
            if (!book || !Number.isInteger(chapter) || chapter < 1 || chapter > book.ch) return;

            currentBookName = book.name;
            currentChapter = String(chapter);
            const saved = cacheGet(version, currentBookName, currentChapter);
            if (saved && !navigator.onLine) {
                currentVerses = saved.verses || [];
                currentTranslationName = saved.translationName || BIBLE_VERSIONS[version].name;
                currentCopyright = saved.copyright || BIBLE_VERSIONS[version].copyright;
                render(currentBookName, currentChapter, currentCopyright, version, currentTranslationName);
                showOfflineNotice();
                return;
            }

            reader.innerHTML = '<div class="loading-spinner" role="status" aria-label="Loading chapter"></div>';

            try {
                const url = `/api/bible?action=chapter&id=${encodeURIComponent(book.id)}&chapter=${encodeURIComponent(chapter)}&version=${encodeURIComponent(version)}`;
                const response = await fetch(url);
                const json = await response.json();
                if (requestId !== chapterRequestId) return;
                if (!response.ok || !json.ok) {
                    throw Object.assign(new Error(json.message || `${BIBLE_VERSIONS[version].name} unavailable`), {
                        payload: json,
                        status: response.status
                    });
                }
                if (String(json.translation || '').toUpperCase() !== version) {
                    throw new Error(`The server returned a different Bible version than ${version}.`);
                }
                let verses = json.verses || [];
                if (!Array.isArray(verses) || !verses.length) throw new Error('The chapter was empty.');
                verses = verses.map(verse => ({
                    verse: parseInt(verse.verse || verse.number || verse.num, 10) || 0,
                    text: String(verse.text || '').replace(/<(?:.|\n)*?>/gm, '').replace(/\s+/g, ' ').trim()
                })).filter(verse => verse.text && verse.verse > 0);
                if (!verses.length) throw new Error('No readable verses were returned.');

                currentVerses = verses;
                currentTranslationName = json.translationName || BIBLE_VERSIONS[version].name;
                currentCopyright = json.copyright || BIBLE_VERSIONS[version].copyright;
                render(currentBookName, currentChapter, currentCopyright, version, currentTranslationName);
                cachePut(version, currentBookName, currentChapter, {
                    verses,
                    copyright: currentCopyright,
                    translationName: currentTranslationName
                });

                await saveChapterProgress(currentBookName, currentChapter);
                if (requestId !== chapterRequestId) return;

                const audioRef = document.getElementById('audioRef');
                const audioVer = document.getElementById('audioVer');
                if (audioRef) audioRef.textContent = `${currentBookName} ${currentChapter}`;
                if (audioVer) audioVer.textContent = `${currentTranslationName} (${version})`;
                const player = document.getElementById('audioPlayer');
                if (player) player.style.display = 'flex';
                hideOfflineNotice();

            } catch (error) {
                if (requestId !== chapterRequestId) return;
                console.warn(`${version} chapter fetch failed:`, error);
                const cached = cacheGet(version, currentBookName, currentChapter);
                if (cached) {
                    currentVerses = cached.verses || [];
                    currentTranslationName = cached.translationName || BIBLE_VERSIONS[version].name;
                    currentCopyright = cached.copyright || BIBLE_VERSIONS[version].copyright;
                    render(currentBookName, currentChapter, currentCopyright, version, currentTranslationName);
                    showOfflineNotice();
                    return;
                }

                const payload = error.payload || {};
                const message = payload.message || error.message || (navigator.onLine
                    ? `The ${BIBLE_VERSIONS[version].name} chapter could not be downloaded. No other translation has been substituted. Please try again.`
                    : "You're offline and this chapter has not been saved on this device yet. Chapters you have read stay available offline.");
                reader.innerHTML = `
                    <div class="bible-error">
                        <i class="pd-i pd-i-book-open-text" style="font-size:2rem; color:var(--accent-gold); display:block; margin-bottom:14px; opacity:.7;"></i>
                        <h4>Unable to load this chapter in ${escapeHtml(BIBLE_VERSIONS[version].name)} (${version})</h4>
                        <p>${escapeHtml(message)}</p>
                        <button onclick="fetchChapter()" style="background:var(--accent-green,#0A4D9B); border:0; color:#fff; font-weight:800; padding:10px 22px; border-radius:50px; cursor:pointer; font-family:'Inter',sans-serif;">
                            <i class="pd-i pd-i-rotate-cw"></i> Try Again
                        </button>
                    </div>`;
            }
        };
        function showOfflineNotice() {
            let n = document.getElementById('bibleOfflineNotice');
            if (!n) {
                n = document.createElement('div');
                n.id = 'bibleOfflineNotice';
                n.style.cssText = 'margin:10px auto 0; max-width:720px; display:flex; align-items:center; gap:10px; background:rgba(10,77,155,.1); border:1px solid rgba(10,77,155,.3); color:var(--text-main,#0f172a); border-radius:14px; padding:10px 14px; font-size:.8rem; font-weight:600;';
                n.innerHTML = '<i class="pd-i pd-i-book-bookmark" style="color:#0A4D9B;"></i><span>Reading your saved copy — this chapter is available offline.</span>';
                const reader = document.getElementById('bibleReader');
                reader.parentNode.insertBefore(n, reader);
            }
            n.style.display = 'flex';
        }
        function hideOfflineNotice() {
            const n = document.getElementById('bibleOfflineNotice');
            if (n) n.style.display = 'none';
        }

        // Re-render from cache the moment connectivity drops mid-reading.
        window.addEventListener('offline', () => { if (currentVerses && currentVerses.length) showOfflineNotice(); });
        window.addEventListener('online', hideOfflineNotice);

        function render(book, ch, copyright, version, translationName) {
            const code = BIBLE_VERSIONS[version] ? version : currentVersion;
            const name = translationName || BIBLE_VERSIONS[code].name;
            const copy = copyright || BIBLE_VERSIONS[code].copyright;
            let html = `<div class="chapter-title-wrap">`
                + `<h2 class="chapter-title">${escapeHtml(book)} ${escapeHtml(ch)}</h2>`
                + `<div class="chapter-translation">${escapeHtml(name)} (${escapeHtml(code)})</div>`
                + `<div class="chapter-divider"></div>`
                + `</div>`
                + `<div class="verses-container" data-pd-no-auto>`;
            currentVerses.forEach((v, i) => {
                const verseText = (v.text || '').trim();
                // Re-add a space between verses so words don't run together.
                html += `<span class="verse-item" id="v-${i}" onclick="selVerse(${i})"><span class="verse-num">${v.verse}</span>${escapeHtml(verseText)}</span> `;
            });
            html += "</div>";
            html += `<p class="bible-copyright">${escapeHtml(copy)}</p>`;
            document.getElementById('bibleReader').innerHTML = html;
            scrollIntoReadingView(document.querySelector('#bibleReader .chapter-title-wrap') || document.getElementById('bibleReader'));
        }

        function selVerse(i) {
            selectedVerseIdx = i;
            document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('selected'));
            const el = document.getElementById(`v-${i}`);
            if (el) {
                el.classList.add('selected');
                document.getElementById('actionBar').style.display = 'flex';
                setTimeout(() => {
                    const bar = document.getElementById('actionBar');
                    if(bar && bar.style.display === 'flex') bar.style.display = 'none';
                }, 5000);
            }
        };

        function copyVerse() {
            if (selectedVerseIdx !== null && currentVerses[selectedVerseIdx]) {
                const v = currentVerses[selectedVerseIdx];
                navigator.clipboard.writeText(`${v.text} — ${currentBookName} ${currentChapter}:${v.verse} (${currentVersion})`);
                alert("Verse copied to clipboard!");
                document.getElementById('actionBar').style.display = 'none';
            }
        };

        function saveNoteFromVerse() {
            if (selectedVerseIdx === null) return;
            const v = currentVerses[selectedVerseIdx];
            document.getElementById('noteRef').textContent = `${currentBookName} ${currentChapter}:${v.verse} (${currentVersion})`;
            document.getElementById('noteText').value = '';
            document.getElementById('noteModal').style.display = 'flex';
        };

        async function saveNote() {
            const noteText = document.getElementById('noteText').value;
            const ref = document.getElementById('noteRef').textContent;
            if (!noteText) return;
            
            if (currentUser) {
                try {
                    await fbApi.addDoc(fbApi.collection(fbDb, "bibleNotes", currentUser.uid, "notes"), {
                        reference: ref,
                        note: noteText,
                        type: 'note',
                        timestamp: fbApi.serverTimestamp()
                    });
                    showToast("Note saved!", "success");
                } catch(e) { console.error(e); }
            } else {
                // Local storage for guests
                const localNotes = JSON.parse(localStorage.getItem('bible_notes') || '[]');
                localNotes.unshift({ reference: ref, note: noteText, date: new Date().toISOString() });
                localStorage.setItem('bible_notes', JSON.stringify(localNotes));
                showToast("Note saved locally!", "success");
            }
            closeModal('noteModal');
            loadNotes();
        };

        function openNoteModal(isGeneral) {
            if (isGeneral) {
                document.getElementById('noteRef').textContent = "General Study Note";
                document.getElementById('noteText').value = '';
                document.getElementById('noteModal').style.display = 'flex';
            }
        };

        async function loadNotes() {
            const container = document.getElementById('notebookList');
            if (!container) return;
            
            let notesList = [];
            
            if (currentUser) {
                try {
                    const notesRef = fbApi.collection(fbDb, "bibleNotes", currentUser.uid, "notes");
                    const q = fbApi.query(notesRef, fbApi.orderBy("timestamp", "desc"));
                    const snapshot = await fbApi.getDocs(q);
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        notesList.push({
                            reference: data.reference,
                            note: data.note,
                            date: data.timestamp?.toDate() || new Date()
                        });
                    });
                } catch(e) { console.error(e); }
            } else {
                const localNotes = JSON.parse(localStorage.getItem('bible_notes') || '[]');
                notesList = localNotes;
            }
            
            if (notesList.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="pd-i pd-i-book-open"></i><p>No notes yet. Select a verse to save!</p></div>';
                return;
            }
            
            container.innerHTML = notesList.map(n => `
                <div class="notebook-item">
                    <div class="notebook-ref"><i class="pd-i pd-i-pen"></i> ${n.reference}</div>
                    <div class="notebook-text">${escapeHtml(n.note)}</div>
                    <div class="notebook-date"><i class="pd-i pd-i-clock"></i> ${new Date(n.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                </div>
            `).join('');
        }

        // Search the selected edition only; the API never substitutes another version.
        async function searchBible() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const version = currentVersion;
            if (!query) return;
            resultsDiv.innerHTML = '<div class="loading-spinner" role="status" aria-label="Searching"></div>';

            try {
                const url = `/api/bible?action=search&q=${encodeURIComponent(query)}&limit=30&version=${encodeURIComponent(version)}`;
                const response = await fetch(url);
                const data = await response.json();
                if (!response.ok || !data.ok) {
                    resultsDiv.innerHTML = `<div class="bible-error"><h4>${escapeHtml(BIBLE_VERSIONS[version].name)} search unavailable</h4><p>${escapeHtml(data.message || 'The selected version cannot be searched right now.')}</p></div>`;
                    return;
                }
                if (String(data.translation || '').toUpperCase() !== version) {
                    throw new Error(`The server returned a different Bible version than ${version}.`);
                }
                if (!data.verses || data.verses.length === 0) {
                    resultsDiv.innerHTML = `<div style="text-align:center; padding:40px;">No results found in ${escapeHtml(version)}.</div>`;
                    return;
                }
                resultsDiv.innerHTML = data.verses.slice(0, 30).map(item => {
                    const reference = String(item.reference || '');
                    const encodedReference = encodeURIComponent(reference).replace(/'/g, '%27');
                    return `
                    <div class="search-result-item" onclick="goToReference('${encodedReference}')">
                        <div class="search-result-ref"><i class="pd-i pd-i-book"></i> ${escapeHtml(reference)} <small style="opacity:.7; font-weight:500;">(${escapeHtml(version)})</small></div>
                        <div class="search-result-text">${escapeHtml(item.text || '')}</div>
                    </div>`;
                }).join('');
            } catch (error) {
                resultsDiv.innerHTML = `<div class="bible-error"><h4>Search error</h4><p>${escapeHtml(error.message || `${BIBLE_VERSIONS[version].name} search is temporarily unavailable.`)}</p></div>`;
            }
        };
        function goToReference(encodedRef) {
            const ref = decodeURIComponent(encodedRef || '');
            const m = ref.match(/^\s*((?:[123]\s)?[A-Za-z]+(?:\s+[A-Za-z]+)?)\s*(\d+)(?::(\d+))?/);
            if (!m) return;
            const name = m[1], ch = parseInt(m[2],10), v = m[3] ? parseInt(m[3],10) : null;
            const idx = bibleBooks.findIndex(b => b.name.toLowerCase() === name.toLowerCase());
            if (idx === -1) return;
            document.getElementById('bookSelect').value = idx;
            updateChapters();
            document.getElementById('chapterSelect').value = ch;
            fetchChapter().then(() => {
                if (v != null) {
                    const vi = currentVerses.findIndex(x => x.verse == v);
                    if (vi !== -1) {
                        selVerse(vi);
                        const el = document.getElementById('v-' + vi);
                        if (el) scrollIntoReadingView(el);
                    }
                }
            });
            switchTab('read');
        };

        function goToChapterAndVerse(bookName, chapter, verse) {
            const bookIndex = bibleBooks.findIndex(b => b.name === bookName);
            if (bookIndex !== -1) {
                document.getElementById('bookSelect').value = bookIndex;
                updateChapters();
                document.getElementById('chapterSelect').value = chapter;
                switchTab('read');
                fetchChapter().then(() => {
                    const verseIdx = currentVerses.findIndex(v => v.verse == verse);
                    if (verseIdx !== -1) {
                        selVerse(verseIdx);
                        const el = document.getElementById(`v-${verseIdx}`);
                        if (el) scrollIntoReadingView(el);
                    }
                });
            }
        };

        // Audio Functions
        let speech = window.speechSynthesis;
        let isReading = false;
        let readIdx = 0;

        function startAudioFromSelected() {
            if (selectedVerseIdx !== null) {
                stopAudio();
                readIdx = selectedVerseIdx;
                playAudio();
                document.getElementById('actionBar').style.display = 'none';
            }
        };

        function playAudio() {
            if (readIdx >= currentVerses.length) {
                stopAudio();
                return;
            }
            if (speech.speaking) speech.cancel();
            
            const utter = new SpeechSynthesisUtterance(currentVerses[readIdx].text);
            utter.rate = parseFloat(document.getElementById('audioSpeed').value);
            utter.onend = () => {
                readIdx++;
                if (isReading && readIdx < currentVerses.length) playAudio();
                else if (readIdx >= currentVerses.length) stopAudio();
            };
            
            document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('reading'));
            const el = document.getElementById(`v-${readIdx}`);
            if (el) {
                el.classList.add('reading');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            speech.speak(utter);
            isReading = true;
            document.getElementById('playBtn').innerHTML = '<i class="pd-i pd-i-pause"></i>';
        }

        function toggleAudio() {
            if (isReading && speech.speaking) {
                speech.cancel();
                isReading = false;
                document.getElementById('playBtn').innerHTML = '<i class="pd-i pd-i-play"></i>';
            } else if (isReading && !speech.speaking) {
                playAudio();
            } else {
                readIdx = selectedVerseIdx || 0;
                playAudio();
            }
        };

        function audioSkip(dir) {
            readIdx += dir;
            if (readIdx < 0) readIdx = 0;
            if (readIdx >= currentVerses.length) readIdx = currentVerses.length - 1;
            if (isReading) {
                if (speech.speaking) speech.cancel();
                playAudio();
            }
        };

        function stopAudio() {
            if (speech.speaking) speech.cancel();
            isReading = false;
            document.getElementById('playBtn').innerHTML = '<i class="pd-i pd-i-play"></i>';
            document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('reading'));
        }

        function switchTab(tab) {
            const panel = document.getElementById(`tab-${tab}`);
            if (!panel) return;
            document.querySelectorAll('.app-tab').forEach(el => {
                const active = el.dataset.tab === tab;
                el.classList.toggle('active', active);
                el.setAttribute('aria-selected', String(active));
            });
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            panel.classList.add('active');
            if (tab === 'notebook') loadNotes();
            if (tab === 'progress') renderReadingPlan();
        };

        /* Scroll so the element sits just below the fixed header, on phones and
           desktops alike. Used whenever a chapter, verse or result is opened. */
        function scrollIntoReadingView(el, behavior) {
            if (!el) return;
            // .pd-topbar is sticky on every page; its height is what the reader must clear.
            const bar = document.querySelector('.pd-topbar');
            const stuck = bar && ['fixed', 'sticky'].includes(getComputedStyle(bar).position);
            const headerHeight = stuck ? bar.offsetHeight : 0;
            const top = el.getBoundingClientRect().top + window.pageYOffset - headerHeight - 12;
            window.scrollTo({ top: Math.max(0, top), behavior: behavior || 'smooth' });
        }

window.toggleDarkMode = function() {
    var dark = (window.PDApp && PDApp.theme ? PDApp.theme.isDark() : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    document.body.classList.toggle('dark-mode', dark);
    document.documentElement.classList.toggle('dark-mode', dark);
    try { var b = document.querySelector('[data-pd-theme-toggle] .pd-i') || document.querySelector('.theme-toggle-btn .pd-i'); if (b) b.className = dark ? 'pd-i pd-i-sun' : 'pd-i pd-i-moon'; } catch (e) {}
};
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.cssText = `position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:${type === 'success' ? 'var(--accent-green)' : 'var(--accent-red)'}; color:white; padding:10px 20px; border-radius:30px; z-index:2000; font-weight:600;`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function onUserChanged(user) {
            currentUser = user;
            loadReadingProgress();
            loadNotes();
        }

        window.audioSkip = audioSkip;
        window.copyVerse = copyVerse;
        window.fetchChapter = fetchChapter;
        window.goToBook = goToBook;
        window.goToChapterAndVerse = goToChapterAndVerse;
        window.goToReference = goToReference;
        window.openNoteModal = openNoteModal;
        window.saveNote = saveNote;
        window.saveNoteFromVerse = saveNoteFromVerse;
        window.searchBible = searchBible;
        window.selVerse = selVerse;
        window.setTextSize = setTextSize;
        window.setVersion = setVersion;
        window.startAudioFromSelected = startAudioFromSelected;
        window.switchTab = switchTab;
        window.toggleAudio = toggleAudio;
        window.updateChapters = updateChapters;

        init();
        loadFirebase().then(ready => {
            if (ready) fbApi.onAuthStateChanged(fbAuth, onUserChanged);
            else onUserChanged(null);
        });
        
    </script>
</body>
</html>
