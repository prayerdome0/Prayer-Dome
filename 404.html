<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A4D9B">
  <title>Page Not Found | Prayer Dome</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/pd-brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#061c38,#0A4D9B);font-family:Montserrat,Arial,sans-serif;color:#fff;text-align:center}.not-found{width:min(620px,100%);padding:42px 28px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:rgba(5,24,49,.78);box-shadow:0 24px 80px rgba(0,0,0,.3)}.not-found img{width:104px;height:104px;object-fit:contain}.code{margin:18px 0 0;color:#f4cc63;font-size:clamp(3rem,12vw,6rem);font-weight:900;line-height:1}.not-found h1{margin:8px 0 12px;font-size:clamp(1.6rem,5vw,2.4rem)}.not-found p{max-width:480px;margin:0 auto 28px;color:#dce8f7;line-height:1.7}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border-radius:999px;background:#d4af37;color:#071a33;font-weight:800;text-decoration:none}.actions a.secondary{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff}
  </style>
</head>
<body>
  <main class="not-found">
    <img src="/assets/logo.png" alt="Prayer Dome">
    <div class="code">404</div>
    <h1>This page could not be found</h1>
    <p>The link may be old or the address may be incomplete. Return home or open the Prayer Dome support page for help.</p>
    <div class="actions">
      <a href="/">Return home</a>
      <a class="secondary" href="/support">Get support</a>
    </div>
  </main>
  <script src="/assets/pd-content-data.js"></script>
  <script src="/assets/pd-verse-data.js" defer></script>
<script src="/assets/pd-verse-alerts.js" defer></script>
<script src="/assets/pd-phrases.js"></script>
<script src="/assets/pd-i18n.js"></script>
<script src="/assets/pd-app.js"></script>
</body>
</html>
