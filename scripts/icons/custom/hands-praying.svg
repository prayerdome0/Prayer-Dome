<!--
  Prayer Dome custom icon: hands-praying
  Lucide has no praying-hands glyph, so this one is drawn to Lucide's icon spec
  (24x24 grid, 2px stroke, round caps and joins, no fill, 2px padding) to match
  the rest of the set. Used for Prayer Requests, the Prayer Wall and "Amen" reactions.
-->
